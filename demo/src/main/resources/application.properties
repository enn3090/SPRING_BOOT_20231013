# =========================================
# 서버 서블릿 인코딩 설정 (한글 깨짐 방지)
# =========================================
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# =========================================
# MySQL 데이터베이스 연결 설정
# =========================================
# DB 연결 주소 (DB이름: spring)
spring.datasource.url=jdbc:mysql://localhost:3306/spring?serverTimezone=UTC&characterEncoding=UTF-8
# DB 사용자 이름 (본인 설정에 맞게 수정)
spring.datasource.username=root
# DB 비밀번호 (본인 설정에 맞게 수정)
spring.datasource.password=1234

# =========================================
# JPA 및 Hibernate 설정
# =========================================
# Java 엔티티를 보고 DB 테이블을 자동으로 업데이트 (데이터 유지)
spring.jpa.hibernate.ddl-auto=update

# =========================================
# 기타 Spring 설정
# =========================================
# HTML 폼에서 PUT, DELETE 메서드를 사용할 수 있도록 허용
spring.mvc.hiddenmethod.filter.enabled=true

# =========================================
# 세션 및 보안 설정 [추가된 부분]
# =========================================
# 세션 만료 시간 설정 (300초 = 5분)
server.servlet.session.timeout=300s
# 쿠키의 HTTPS 전송 활성화 (보안 강화)
# [수정] true를 false로 변경하세요. (localhost는 보안 연결이 아니라서 true면 안 됩니다)
server.servlet.session.cookie.secure=false